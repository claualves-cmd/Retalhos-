<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1e6" />
  <title>Retalhos — O mundo feito de memórias</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./estilos.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span>
        <span class="brand-name">RETALHOS</span>
        <span class="brand-sub">O MUNDO FEITO DE MEMÓRIAS</span>
      </span>
    </a>
    <p class="topbar-tagline">Retalhos de viagens, dias e lugares que ficam na memória.</p>
  </header>

  <main class="page">
    <section class="card map-section" aria-label="Mapa de memórias">
      <div id="map" class="map-canvas"></div>
      <div class="map-footer">
        <span id="mapStatus" class="map-status">A PREPARAR MAPA…</span>
        <button id="centerMapBtn" type="button" class="btn btn-ghost">Centrar em Portugal</button>
      </div>

      <div class="import-date-bar">
        <label for="importDateInput"><strong>Data para importar (opcional):</strong></label>
        <input id="importDateInput" type="date" />
        <span class="muted">Se ficar vazio, usa a data da foto.</span>
      </div>

      <div class="action-row">
        <input id="photoInput" type="file" accept="image/*" multiple hidden />
        <button id="addPhotosBtn" type="button" class="btn btn-primary">+ Adicionar fotos</button>
        <button id="printQuiltBtn" type="button" class="btn btn-secondary">Imprimir manta</button>
      </div>

      <div class="year-filter-row">
        <div id="yearFilterPills" class="year-pills" aria-label="Filtrar por ano"></div>
        <span id="yearFilterSummary" class="muted">Todas as memórias</span>
      </div>
    </section>

    <section id="pendingCard" class="card pending-card-section" hidden>
      <div class="pending-head">
        <h2>Fotos sem localização (<span id="pendingCount">0</span>)</h2>
        <label class="select-all">
          <input id="selectAllPending" type="checkbox" />
          <span>Selecionar todas</span>
        </label>
      </div>
      <div id="pendingList" class="pending-grid"></div>
      <div class="pending-assign">
        <div class="pending-search-row">
          <input id="pendingPlaceInput" type="search" placeholder="Procurar local (ex.: Sintra, Nantes, Caldas da Rainha…)" />
          <button id="pendingSearchBtn" type="button" class="btn btn-secondary">Procurar</button>
        </div>
        <div id="pendingSearchResults" class="pending-results"></div>
        <button id="assignPendingBtn" type="button" class="btn btn-primary" disabled>Atribuir local às selecionadas</button>
      </div>
    </section>

    <section class="card stats-section" aria-label="Estatísticas">
      <div class="stats-grid">
        <div class="stat-item">
          <strong id="statMemories">0</strong>
          <span>Memórias</span>
        </div>
        <div class="stat-item">
          <strong id="statPlaces">0</strong>
          <span>Locais</span>
        </div>
        <div class="stat-item">
          <strong id="statCountries">0</strong>
          <span>Países</span>
        </div>
      </div>

      <div class="backup-row">
        <input id="importJsonInput" type="file" accept="application/json,.json" hidden />
        <button id="exportJsonBtn" type="button" class="btn btn-ghost">Exportar cópia</button>
        <button id="importJsonBtn" type="button" class="btn btn-ghost">Importar cópia</button>
      </div>
    </section>
  </main>

  <div id="printQuiltOverlay" class="print-quilt-overlay" hidden>
    <div class="print-quilt-toolbar">
      <button id="closePrintQuiltBtn" type="button" class="btn btn-ghost">← Voltar ao mapa</button>
      <button id="triggerPrintQuiltBtn" type="button" class="btn btn-primary">Imprimir / Guardar PDF</button>
    </div>
    <div class="print-quilt-sheet">
      <div class="print-quilt-header">
        <h2>Retalhos — O mundo feito de memórias</h2>
        <p id="printQuiltMeta" class="muted"></p>
      </div>
      <div id="printQuiltGrid" class="print-quilt-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app-controls.js"></script>
  <script src="./location-stats.js"></script>
</body>
</html>
