
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1e6" />
  <title>Retalhos — O mundo feito de memórias</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./estilos.css" />
  <style>
    .topbar{height:auto;min-height:84px;padding:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-bottom:1px solid rgba(47,90,75,.12)}
    .topbar-tagline{max-width:560px;margin:0;color:#6f786f;font:italic 14px/1.45 Georgia,"Times New Roman",serif;text-align:center}
    .import-date-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0;padding:10px 14px;border-radius:14px;background:#fbf9f3;border:1px solid rgba(47,90,75,.14);font-size:13px;color:#243028}
    .import-date-bar input[type="date"]{padding:6px 10px;border-radius:10px;border:1px solid rgba(47,90,75,.25);background:#fff;color:#1f2a22;font:inherit}
    .year-filter-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(47,90,75,.12)}
    .year-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .year-pill{padding:6px 12px;border-radius:999px;border:1px solid rgba(47,90,75,.22);background:#fff;color:#26332a;font-size:12px;font-weight:600;cursor:pointer}
    .year-pill.active{background:#2f5a4b;color:#fffdf7;border-color:#2f5a4b}
    .print-quilt-overlay{position:fixed;inset:0;z-index:2000;background:#f5f1e6;color:#1f2a22;overflow:auto;padding:24px}
    .print-quilt-overlay[hidden]{display:none}
    .print-quilt-toolbar{max-width:1120px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
    .print-quilt-sheet{max-width:1120px;margin:0 auto;background:#fffdf7;border:1px solid rgba(47,90,75,.18);border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .print-quilt-header{text-align:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid rgba(47,90,75,.16)}
    .print-quilt-header h2{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:28px;color:#23332b}
    .print-quilt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .print-quilt-tile{aspect-ratio:4 / 3;overflow:hidden;border-radius:3px;padding:2px;border:1px solid rgba(47,90,75,.18);background:#fffdf7;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .print-quilt-tile img{width:100%;height:100%;object-fit:cover;display:block;border-radius:1px}
    @media(max-width:620px){
      .topbar{height:auto;min-height:68px;padding:12px 0;gap:4px}
      .topbar-tagline{max-width:92%;font-size:12px;line-height:1.35}
      .print-quilt-grid{grid-template-columns:repeat(3,1fr);gap:6px}
      .print-quilt-sheet{padding:16px}
    }
    @media print{
      body > :not(.print-quilt-overlay){display:none!important}
      .print-quilt-overlay{position:static;padding:0;background:#fff}
      .print-quilt-toolbar{display:none!important}
      .print-quilt-sheet{box-shadow:none;border:0;border-radius:0;padding:0;max-width:none}
      .print-quilt-grid{grid-template-columns:repeat(5,1fr);gap:6px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span>
        <span class="brand-name">RETALHOS</span>
        <span class="brand-sub">O MUNDO FEITO DE MEMÓRIAS</span>
      </span>
    </a>
    <p class="topbar-tagline">Retalhos de viagens, dias e lugares que ficam na memória.</p>
